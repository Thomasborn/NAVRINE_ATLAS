<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Primary SEO -->
  <title>Navrine Atlas — Trend, Aesthetic, Design Concept &amp; Visual Culture Catalog</title>
  <meta name="description" content="Navrine Atlas is a visual culture catalog for discovering trends, aesthetics, design concepts, creative taste, photography styles, viral signals, color palettes, AI prompts, assets, and brand inspiration." />
  <meta name="keywords" content="visual culture catalog, aesthetic library, design concept catalog, photography style guide, viral signal tracker, AI prompt library, color palette library, brand inspiration, Indonesian music visual, Y2K web design, urban street photography, creative direction" />
  <meta name="author" content="Navrine Studio" />
  <link rel="canonical" href="https://atlas.navrine.space/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Navrine Atlas" />
  <meta property="og:title" content="Navrine Atlas — Trend, Aesthetic &amp; Visual Culture Catalog" />
  <meta property="og:description" content="A visual culture catalog for trends, aesthetics, design concepts, creative taste, photography styles, viral signals, color palettes, and AI prompts." />
  <meta property="og:url" content="https://atlas.navrine.space/" />
  <meta property="og:image" content="https://atlas.navrine.space/og.png" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="id_ID" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@navrine" />
  <meta name="twitter:title" content="Navrine Atlas — The Visual Culture Catalog" />
  <meta name="twitter:description" content="Read the signals. Build the taste. Design the future." />
  <meta name="twitter:image" content="https://atlas.navrine.space/og.png" />

  <!-- WebSite schema with SearchAction -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Navrine Atlas",
    "alternateName": ["Atlas by Navrine", "Navrine Design Atlas", "Navrine Trend Atlas"],
    "url": "https://atlas.navrine.space/",
    "description": "A visual culture catalog for trends, aesthetics, design concepts, creative taste, photography styles, viral signals, color palettes, AI prompts, assets, and brand inspiration.",
    "inLanguage": ["en", "id"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://atlas.navrine.space/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Organization schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Navrine Studio",
    "url": "https://navrine.space",
    "logo": "https://atlas.navrine.space/icon.png",
    "sameAs": [
      "https://twitter.com/navrine",
      "https://instagram.com/navrine",
      "https://www.linkedin.com/company/navrine"
    ]
  }
  </script>

  <!-- Breadcrumb -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [{
      "@type": "ListItem",
      "position": 1,
      "name": "Atlas",
      "item": "https://atlas.navrine.space/"
    }]
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
